<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="••••••••••••••••••••••••••••••••••••••••••••••••••"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Destawell | Mobile Pentesting Tools & Automation</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/b/b5/Termux.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #0a0e14;
      --text: #e2e8f0;
      --accent: #10b981;
      --border: #1f2937;
      --card: #111827;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    
    header.navbar {
      position: fixed; top:0; left:0; right:0;
      background: rgba(10,14,20,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
    }

    .brand-wrapper { display: flex; align-items: center; gap: 1rem; }
    .logo { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    
    /* This is where the button lives */
    #auth-button-root { display: flex; align-items: center; min-height: 35px; }

    nav a { color: var(--text); margin-left: 1.5rem; text-decoration: none; font-size: 0.9rem; }
    .hero { min-height: 100vh; display: flex; align-items: center; text-align: center; padding: 0 5%; background: radial-gradient(circle at center, #111827 0%, #0a0e14 100%); }
    .container { max-width: 1200px; margin: 0 auto; width: 100%; }
    h1 { font-size: 4rem; margin-bottom: 1rem; }
    .btn { background: var(--accent); color: #000; padding: 0.8rem 2rem; border-radius: 5px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand-wrapper">
        <div class="logo">Destawell</div>
        <div id="auth-button-root">
          </div>
    </div>
    <nav>
      <a href="#home">Home</a>
      <a href="#projects">Projects</a>
      <a href="https://github.com/Niranj-coder" target="_blank">GitHub</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <div class="container">
      <h1>Build Mobile Pentesting Solutions</h1>
      <p style="font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.8;">No-root Termux & Kali NetHunter tools for Android.</p>
      <a href="#projects" class="btn">Explore Tools</a>
    </div>
  </section>

  <script>
    window.addEventListener('load', async function () {
      try {
        await Clerk.load();
        const authContainer = document.getElementById('auth-button-root');

        if (Clerk.user) {
          // If logged in, show the User Profile Circle
          Clerk.mountUserButton(authContainer);
        } else {
          // If logged out, inject the actual button
          authContainer.innerHTML = `
            <button id="clerk-trigger" style="background:var(--accent); color:#000; padding:6px 14px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; font-size: 0.8rem; font-family: inherit;">
              Sign In
            </button>`;

          // Add listener to open the Modal
          document.getElementById('clerk-trigger').addEventListener('click', () => {
            Clerk.openSignIn();
          });
        }
      } catch (err) {
        console.error("Clerk failed to load. Check your API Key!", err);
      }
    });
  </script>

</body>
</html>
